name: Créditos flujo directo CI
on:
  push:
    branches: [feat-creditos-flujo-directo-20261009]
  pull_request:
    branches: [update-requerimientos]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://validation:validation@localhost:5432/validation?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test -- --runInBand credit-http.dto.spec
      - run: npm test -- --runInBand credit-application.commands.spec
      - run: npm test -- --runInBand credit-payment-plan.commands.spec
      - run: npm test -- --runInBand payment-workflow.prisma-mixed-advance.spec
      - run: npm test -- --runInBand credit-plan-activate-before-delivery.spec
      - run: npm test -- --runInBand reconcile-direct-payment.prisma.spec
      - run: npm test -- --runInBand order-delivery-gate.adapter.spec
