name: Comprobantes operativos
on:
  push:
    branches: [update-requerimientos, feat-comprobantes-operativos-20261009]
    paths:
      - "src/modules/comprobantes/**"
      - "src/app.module.ts"
      - "prisma/schema.prisma"
      - "prisma/migrations/20261009014000_comprobantes_operativos_v1/**"
      - ".github/workflows/comprobantes-operativos.yml"
  pull_request:
    branches: [update-requerimientos]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://validation:validation@localhost:5432/validation?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Tests del modulo
        run: npm test -- --runInBand comprobantes
      - name: Nest build
        run: npm run build
