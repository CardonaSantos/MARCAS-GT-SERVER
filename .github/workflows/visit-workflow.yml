name: Visit workflow contract
on:
  push:
    branches: [update-requerimientos]
    paths:
      - "src/date/**"
      - ".github/workflows/visit-workflow.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visit-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Visit workflow unit tests
        run: npm test -- --runInBand src/date/workflow
      - name: TypeScript and NestJS build
        run: npm run build
